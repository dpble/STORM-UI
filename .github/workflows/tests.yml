name: tests

# Runs the full test suite on Linux, macOS and Windows on every push and pull
# request. The lab analysis PC is Windows, so the Windows job is the one that
# shows the app works there.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ---- storm-analysis (not on PyPI). Same steps as its own CI.
      - name: C libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfftw3-dev liblapack-dev \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: C libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install fftw lapack

      - name: Install storm-analysis from source (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          git clone --depth 1 --branch v2.4.1 https://github.com/ZhuangLab/storm-analysis ../storm-analysis
          python -m pip install --upgrade pip scons
          python -m pip install -e ../storm-analysis
      - name: Install storm-analysis wheel (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          python -m pip install https://github.com/ZhuangLab/storm-analysis/releases/download/v2.4.1/storm_analysis-2.4.1-py3-none-win_amd64.whl

      # ---- this repo
      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q -ra tests

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: tests/output/*.png
          if-no-files-found: ignore
